name: K-Slide security evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0 semgrep==1.89.0
      - name: Prepare sanitized scanner directory
        run: mkdir -p "$RUNNER_TEMP/k-slide-security"
      - name: Dependency audit
        run: |
          set +e
          pip-audit --strict --format json --output "$RUNNER_TEMP/k-slide-security/pip-audit.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/k-slide-security/pip-audit.exit"
          exit 0
      - name: Secret scan
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/k-slide-security:/reports" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact --report-format json --report-path /reports/gitleaks.json
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/k-slide-security/gitleaks.exit"
          exit 0
      - name: Static security scan
        run: |
          set +e
          semgrep --config p/python --error --json --output "$RUNNER_TEMP/k-slide-security/semgrep.json" src evals
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/k-slide-security/semgrep.exit"
          exit 0
      - name: Assemble scanner exit codes
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "k-slide-security"
          exits = {}
          for name in ("pip-audit", "gitleaks", "semgrep"):
              path = root / f"{name}.exit"
              if not path.is_file():
                  raise SystemExit(f"missing scanner exit-code file: {path.name}")
              try:
                  value = int(path.read_text(encoding="utf-8").strip())
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"malformed scanner exit-code file: {path.name}") from exc
              exits[name.replace("-", "_")] = value
          (root / "scanner-exits.json").write_text(json.dumps(exits, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Compute deployment identity
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "src")
          sys.path.insert(0, ".")
          from evals.scenarios import DATASET_VERSION, split_manifest
          from k_slide.certification import candidate_deployment_fingerprint, canonical_candidate_factors, load_candidate_spec
          from k_slide.model_policy import load_model_policy

          out = Path(os.environ["RUNNER_TEMP"]) / "k-slide-security" / "identity.json"
          candidate_path = Path(os.environ["RUNNER_TEMP"]) / "k-slide-security" / "candidate.json"
          split = split_manifest()
          candidate = load_candidate_spec(Path("evals/production-candidate.yaml"), root=Path.cwd())
          candidate["subject_git_sha"] = os.environ.get("GITHUB_SHA", "UNSET")
          candidate["model_policy"] = load_model_policy(Path.cwd()).as_dict()
          candidate["corpus_identity"] = {
              "version": DATASET_VERSION,
              "corpus_fingerprint": split["corpus_fingerprint"],
              "held_out_fingerprint": split["held_out_fingerprint"],
          }
          candidate_path.write_text(json.dumps(candidate, sort_keys=True) + "\n", encoding="utf-8")
          summary = {"subject_git_sha": candidate["subject_git_sha"], "deployment_fingerprint": candidate_deployment_fingerprint(candidate), "candidate_spec": canonical_candidate_factors(candidate), "candidate_profile": str(candidate_path)}
          out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Derive security evidence and enforce result
        if: always()
        run: |
          set +e
          subject=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"k-slide-security","identity.json")))["subject_git_sha"])')
          deployment=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"k-slide-security","identity.json")))["deployment_fingerprint"])')
          PYTHONPATH=src:. python -m k_slide.evidence_adapters security \
            --output "$RUNNER_TEMP/k-slide-security/security.evidence.json" \
            --candidate-profile "$RUNNER_TEMP/k-slide-security/candidate.json" \
            --subject-sha "$subject" \
            --deployment-fingerprint "$deployment" \
            --source pip_audit="$RUNNER_TEMP/k-slide-security/pip-audit.json" \
            --source gitleaks="$RUNNER_TEMP/k-slide-security/gitleaks.json" \
            --source semgrep="$RUNNER_TEMP/k-slide-security/semgrep.json" \
            --source scanner_exits="$RUNNER_TEMP/k-slide-security/scanner-exits.json"
          code=$?
          exit $code
      - name: Upload sanitized security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-security-evidence
          path: |
            ${{ runner.temp }}/k-slide-security/
