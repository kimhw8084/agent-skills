name: K-Slide security evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0 semgrep==1.89.0
      - name: Prepare sanitized scanner directory
        run: mkdir -p "$RUNNER_TEMP/k-slide-security"
      - name: Dependency audit
        run: |
          set +e
          pip-audit --strict --format json --output "$RUNNER_TEMP/k-slide-security/pip-audit.json"
          code=$?
          printf '{"pip_audit":%s,"gitleaks":null,"semgrep":null}\n' "$code" > "$RUNNER_TEMP/k-slide-security/scanner-exits.partial.json"
          exit 0
      - name: Secret scan
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/k-slide-security:/reports" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact --report-format json --report-path /reports/gitleaks.json
          code=$?
          test -f "$RUNNER_TEMP/k-slide-security/gitleaks.json" || printf '[]\n' > "$RUNNER_TEMP/k-slide-security/gitleaks.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'k-slide-security' / 'scanner-exits.partial.json'
          value = json.loads(p.read_text())
          value['gitleaks'] = int(__import__('os').environ.get('GITLEAKS_EXIT', '0'))
          p.write_text(json.dumps(value) + '\n')
          PY
          sed -i "s/\"gitleaks\":0/\"gitleaks\":$code/" "$RUNNER_TEMP/k-slide-security/scanner-exits.partial.json"
          exit 0
      - name: Static security scan
        run: |
          set +e
          semgrep --config p/python --error --json --output "$RUNNER_TEMP/k-slide-security/semgrep.json" src evals
          code=$?
          sed -i "s/\"semgrep\":null/\"semgrep\":$code/" "$RUNNER_TEMP/k-slide-security/scanner-exits.partial.json"
          cp "$RUNNER_TEMP/k-slide-security/scanner-exits.partial.json" "$RUNNER_TEMP/k-slide-security/scanner-exits.json"
          exit 0
      - name: Compute deployment identity
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "src")
          sys.path.insert(0, ".")
          from evals.scenarios import DATASET_VERSION, split_manifest
          from k_slide.certification import build_deployment_factors, deployment_fingerprint
          from k_slide.model_policy import load_model_policy
          from k_slide.runtime import discover_runtime

          out = Path(os.environ["RUNNER_TEMP"]) / "k-slide-security" / "identity.json"
          split = split_manifest()
          manifest = {
              "version": DATASET_VERSION,
              "corpus_fingerprint": split["corpus_fingerprint"],
              "held_out_fingerprint": split["held_out_fingerprint"],
          }
          factors = build_deployment_factors(Path.cwd(), subject_git_sha=os.environ.get("GITHUB_SHA", "UNSET"), runtime=discover_runtime(), model_policy=load_model_policy(Path.cwd()), corpus=manifest)
          summary = {"subject_git_sha": os.environ.get("GITHUB_SHA", "UNSET"), "deployment_fingerprint": deployment_fingerprint(factors)}
          out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Derive security evidence and enforce result
        if: always()
        run: |
          set +e
          subject=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"k-slide-security","identity.json")))["subject_git_sha"])')
          deployment=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"k-slide-security","identity.json")))["deployment_fingerprint"])')
          PYTHONPATH=src:. python -m k_slide.evidence_adapters security \
            --output "$RUNNER_TEMP/k-slide-security/security.evidence.json" \
            --subject-sha "$subject" \
            --deployment-fingerprint "$deployment" \
            --source pip_audit="$RUNNER_TEMP/k-slide-security/pip-audit.json" \
            --source gitleaks="$RUNNER_TEMP/k-slide-security/gitleaks.json" \
            --source semgrep="$RUNNER_TEMP/k-slide-security/semgrep.json" \
            --source scanner_exits="$RUNNER_TEMP/k-slide-security/scanner-exits.json"
          code=$?
          exit $code
      - name: Upload sanitized security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-security-evidence
          path: |
            ${{ runner.temp }}/k-slide-security/
