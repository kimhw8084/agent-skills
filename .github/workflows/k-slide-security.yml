name: K-Slide security evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0 semgrep==1.89.0
      - name: Dependency audit
        run: pip-audit --strict --format json --output "$RUNNER_TEMP/k-slide-pip-audit.json"
      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact
      - name: Static security scan
        run: semgrep --config p/python --error --json --output "$RUNNER_TEMP/k-slide-semgrep.json" src evals
      - name: Write sanitized security summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "src")
          sys.path.insert(0, ".")
          from evals.scenarios import DATASET_VERSION, split_manifest
          from k_slide.certification import build_deployment_factors, deployment_fingerprint
          from k_slide.model_policy import load_model_policy
          from k_slide.runtime import discover_runtime

          out = Path(os.environ["RUNNER_TEMP"]) / "k-slide-security-summary.json"
          split = split_manifest()
          manifest = {
              "version": DATASET_VERSION,
              "corpus_fingerprint": split["corpus_fingerprint"],
              "held_out_fingerprint": split["held_out_fingerprint"],
          }
          factors = build_deployment_factors(Path.cwd(), subject_git_sha=os.environ.get("GITHUB_SHA", "UNSET"), runtime=discover_runtime(), model_policy=load_model_policy(Path.cwd()), corpus=manifest)
          summary = {
              "schema_version": "1.0",
              "subject_git_sha": os.environ.get("GITHUB_SHA", "UNSET"),
              "deployment_fingerprint": deployment_fingerprint(factors),
              "tools": {"pip_audit": "2.9.0", "gitleaks": "8.24.2", "semgrep": "1.89.0"},
              "status": "PASS" if os.environ.get("JOB_STATUS") == "success" else "FAIL",
          }
          out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload sanitized security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-security-evidence
          path: |
            ${{ runner.temp }}/k-slide-security-summary.json
            ${{ runner.temp }}/k-slide-pip-audit.json
            ${{ runner.temp }}/k-slide-semgrep.json
