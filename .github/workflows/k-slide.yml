name: K-Slide

on:
  push:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide.yml"
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: k-slide/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf,pptx]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m k_slide.cli doctor --root . --json
      - run: |
          target=$(mktemp -d)
          python -m k_slide.cli install --source-root . --target "$target" --scope project --json
          python -m k_slide.cli verify-install --target "$target" --scope project --json
