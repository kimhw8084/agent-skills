name: K-Slide

on:
  push:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide.yml"
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install K-Slide test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pdf,pptx,dev]"
      - name: Compile
        run: python -m compileall -q src tests evals
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Synthetic artifact evaluation smoke
        run: PYTHONPATH=src python -m evals.run_engine_eval --output "$RUNNER_TEMP/k-slide-eval" --limit 5
