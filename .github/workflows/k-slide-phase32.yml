name: K-Slide Phase 3.5 execution isolation and heavy runtime

on:
  push:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide-phase32.yml"
  pull_request:
    paths:
      - "k-slide/**"
      - ".github/workflows/k-slide-phase32.yml"
  workflow_dispatch:
    inputs:
      production_dependency_lock:
        description: "Private exact production lock for a certifying heavy image"
        required: false
        type: string

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verified Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install K-Slide test dependencies
        run: python -m pip install -e ".[dev,pdf,pptx]"
      - name: Verify Korean font and split manifest
        run: python -m evals.generate_corpus --output /tmp/k-slide-corpus --formats png --limit 1
      - name: Verify corpus fingerprints and certification schema
        run: |
          PYTHONPATH=src python -m evals.generate_corpus --output /tmp/k-slide-corpus-fingerprint --formats png --limit 1
          python -m json.tool schemas/translation-patch.schema.json >/dev/null
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q src evals tests
      - name: Doctor
        run: PYTHONPATH=src python -m k_slide.cli doctor --root . --json
      - name: Exercise project installer wrappers
        run: |
          target="$(mktemp -d)"
          ./scripts/install_project.sh "$target"
          ./scripts/verify_install.sh "$target"

  heavy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k-slide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Freeze exact production dependency subject
        env:
          KSLIDE_PRODUCTION_LOCK: ${{ inputs.production_dependency_lock || '' }}
        run: |
          python -m venv "$RUNNER_TEMP/k-slide-production-env"
          lock_input="$KSLIDE_PRODUCTION_LOCK"
          if [ -n "$lock_input" ]; then
            test -f "$lock_input"
            "$RUNNER_TEMP/k-slide-production-env/bin/python" -m pip install --disable-pip-version-check --no-input -r "$lock_input"
          else
            "$RUNNER_TEMP/k-slide-production-env/bin/python" -m pip install --disable-pip-version-check --no-input -r constraints-production.txt
          fi
          freeze_args=(--inventory-output .k-slide-config/production-dependency-inventory.json --lock-output .k-slide-config/production-requirements.lock)
          if [ -n "$lock_input" ]; then freeze_args+=(--lock-input "$lock_input"); fi
          PYTHONPATH=src:. "$RUNNER_TEMP/k-slide-production-env/bin/python" -m evals.freeze_production_dependencies "${freeze_args[@]}"
      - name: Build heavy evaluation image
        run: docker build --build-arg PRODUCTION_LOCK=.k-slide-config/production-requirements.lock -f evals/heavy/Dockerfile -t k-slide-heavy .
      - name: Verify heavy image dependency identity
        run: |
          docker run --rm --entrypoint python k-slide-heavy -c 'import json; from k_slide.certification import installed_dependency_inventory; print(json.dumps(installed_dependency_inventory(), sort_keys=True))' > "$RUNNER_TEMP/k-slide-heavy-image-inventory.json"
          PYTHONPATH=src:. python - <<'PY'
          import json
          import os
          from pathlib import Path

          from k_slide.certification import load_dependency_inventory

          expected = load_dependency_inventory(Path(".k-slide-config/production-dependency-inventory.json"))
          actual = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k-slide-heavy-image-inventory.json").read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit(json.dumps({"expected": expected, "actual": actual}, sort_keys=True))
          PY
      - name: Prepare explicit heavy candidate specification
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path

          from k_slide.certification import canonical_behavior_configuration, load_candidate_spec

          candidate = load_candidate_spec(Path("evals/production-candidate.yaml"), root=Path.cwd())
          candidate["subject_git_sha"] = os.environ["GITHUB_SHA"]
          candidate["ocr_provider"] = "paddle"
          behavior = dict(candidate.get("behavior_configuration") or {})
          behavior["ocr_provider"] = "paddle"
          candidate["behavior_configuration"] = canonical_behavior_configuration(behavior)
          output = Path(os.environ["RUNNER_TEMP"]) / "k-slide-heavy-candidate.json"
          output.write_text(json.dumps(candidate, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Run heavy self-test
        run: |
          mkdir -p "${RUNNER_TEMP}/k-slide-heavy-doctor"
          docker run --rm --network none \
            -v "${RUNNER_TEMP}/k-slide-heavy-doctor:/out" \
            k-slide-heavy --required --networkless \
            | tee "${RUNNER_TEMP}/k-slide-heavy-doctor/doctor.json"
      - name: Run representative heavy engine subset with production OCR routing
        run: |
          mkdir -p "${RUNNER_TEMP}/k-slide-heavy-engine-subset"
          docker run --rm --network none \
            -v "${RUNNER_TEMP}/k-slide-heavy-engine-subset:/out" \
            -v "${RUNNER_TEMP}/k-slide-heavy-candidate.json:/candidate.json:ro" \
            --entrypoint python k-slide-heavy -m evals.run_engine_eval \
            --output /out \
            --candidate-profile /candidate.json \
            --subject-sha "${GITHUB_SHA}" \
            --split development \
            --scenario-ids scenario-0002 scenario-0017 scenario-0031 scenario-0051 scenario-0066 \
            --formats png pdf pptx \
            --ocr-provider paddle \
            --fail-on-critical
      - name: Publish heavy evaluation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-heavy-summary
          path: |
            ${{ runner.temp }}/k-slide-heavy-doctor/
            ${{ runner.temp }}/k-slide-heavy-engine-subset/
